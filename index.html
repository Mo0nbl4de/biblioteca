<script>
const supabase = window.supabase.createClient(
  "https://ugfirrajqityvrgmndhz.supabase.co",
  "sb_publishable_SUA_CHAVE_AQUI"
);

let audios = [];

async function carregarAudios() {
  const { data, error } = await supabase
    .from("audios")
    .select("*")
    .order("id", { ascending: true });

  if (error) {
    alert("Erro ao carregar: " + error.message);
    console.error(error);
    return;
  }

  audios = data;
  renderizar();
}

async function salvarAudio() {
  const nome = nomeAudio.value.trim();
  const link = audioLink.value.trim();

  if (!nome || !link) {
    alert("Preencha nome e link");
    return;
  }

  const { error } = await supabase
    .from("audios")
    .insert([{ nome, link }]);

  if (error) {
    alert("Erro ao salvar: " + error.message);
    console.error(error);
    return;
  }

  nomeAudio.value = "";
  audioLink.value = "";
  carregarAudios();
}

function renderizar() {
  const filtro = pesquisa.value.toLowerCase();
  listaAudios.innerHTML = "";

  audios
    .filter(a => a.nome.toLowerCase().includes(filtro))
    .forEach(a => {
      const div = document.createElement("div");
      div.className = "audio-item";

      div.innerHTML = `
        <strong>${a.nome}</strong>
        <audio controls src="${a.link}"></audio>
      `;

      listaAudios.appendChild(div);
    });
}

carregarAudios();
</script>
