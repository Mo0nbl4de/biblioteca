<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎧 Biblioteca de Áudios</title>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }

    .audio-item {
      background: #222;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }

    audio {
      width: 100%;
      height: 28px;
      margin-top: 5px;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>🎧 Biblioteca de Áudios</h2>

<input id="nomeAudio" placeholder="Nome do áudio">
<input id="audioLink" placeholder="Link direto (.mp3)">

<!-- 🔥 BOTÃO CORRIGIDO -->
<button id="salvar" type="button">Salvar áudio</button>

<hr>

<input id="pesquisa" placeholder="🔍 Pesquisar pelo nome...">

<div id="listaAudios"></div>

<script>
/* =====================================================
   🔑 CONFIGURAÇÃO DO SUPABASE
   ===================================================== */

/* ✅ Project URL */
const SUPABASE_URL = "https://ugfirrajqityvrgmndhz.supabase.co";

/* ✅ Publishable key (cole a sua aqui) */
const SUPABASE_KEY = "sb_publishable_ivICA8vC-FaVguwsQVrqeQ_SqoOlpHR";

/* ===================================================== */

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ELEMENTOS */
const nomeInput = document.getElementById("nomeAudio");
const linkInput = document.getElementById("audioLink");
const lista = document.getElementById("listaAudios");
const pesquisaInput = document.getElementById("pesquisa");
const salvarBtn = document.getElementById("salvar");

/* ESTADO */
let audios = [];

/* 🔄 CARREGAR ÁUDIOS */
async function carregarAudios() {
  const { data, error } = await supabaseClient
    .from("audios")
    .select("*")
    .order("id", { ascending: true });

  if (error) {
    alert("Erro ao carregar áudios: " + error.message);
    console.error(error);
    return;
  }

  audios = data || [];
  renderizar();
}

/* 💾 SALVAR ÁUDIO */
async function salvarAudio() {
  const nome = nomeInput.value.trim();
  const link = linkInput.value.trim();

  if (!nome || !link) {
    alert("Preencha nome e link");
    return;
  }

  const { error } = await supabaseClient
    .from("audios")
    .insert([
      { nome: nome, link: link }
    ]);

  if (error) {
    alert("Erro ao salvar áudio: " + error.message);
    console.error(error);
    return;
  }

  // limpa os campos
  nomeInput.value = "";
  linkInput.value = "";

  // recarrega a lista
  carregarAudios();
}

/* 🎨 MOSTRAR NA TELA */
function renderizar() {
  const filtro = pesquisaInput.value.toLowerCase();
  lista.innerHTML = "";

  audios
    .filter(a => a.nome.toLowerCase().includes(filtro))
    .forEach(a => {
      const div = document.createElement("div");
      div.className = "audio-item";

      const titulo = document.createElement("strong");
      titulo.innerText = a.nome;

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = a.link;

      div.appendChild(titulo);
      div.appendChild(audio);

      lista.appendChild(div);
    });
}

/* EVENTOS (COM PREVENTDEFAULT POR SEGURANÇA) */
salvarBtn.addEventListener("click", (e) => {
  e.preventDefault();
  salvarAudio();
});

pesquisaInput.addEventListener("input", renderizar);

/* INICIAR */
carregarAudios();
</script>

</body>
</html>
