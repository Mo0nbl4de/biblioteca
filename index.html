<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Áudios</title>

<style>
body {
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.audio-item {
  background: #222;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
}
audio {
  width: 100%;
  height: 28px;
  margin-top: 5px;
}
input, button {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
}
</style>
</head>

<body>

<h2>🎧 Biblioteca de Áudios (Online)</h2>

<input id="pesquisa" placeholder="🔍 Pesquisar pelo nome...">
<button onclick="alert('Para adicionar ou editar áudios, edite o arquivo audios.json no GitHub')">
➕ Adicionar / Editar áudio
</button>

<div id="listaAudios"></div>

<script>
let audios = [];
let loopAtivo = false;
let sequenciaAtiva = false;

const lista = document.getElementById("listaAudios");
const pesquisaInput = document.getElementById("pesquisa");

// 🔽 CARREGA DO GITHUB (NUVEM)
fetch("audios.json")
  .then(r => r.json())
  .then(dados => {
    audios = dados;
    renderizar();
  });

function renderizar() {
  const filtro = pesquisaInput.value.toLowerCase();
  lista.innerHTML = "";

  audios
    .filter(a => a.nome.toLowerCase().includes(filtro))
    .forEach((a, i) => {
      const div = document.createElement("div");
      div.className = "audio-item";

      const titulo = document.createElement("strong");
      titulo.innerText = a.nome;

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = a.link;
      audio.loop = loopAtivo;

      audio.onended = () => {
        if (sequenciaAtiva && audios[i + 1]) {
          document.querySelectorAll("audio")[i + 1].play();
        }
      };

      div.appendChild(titulo);
      div.appendChild(audio);
      lista.appendChild(div);
    });
}

pesquisaInput.oninput = renderizar;
</script>

</body>
</html>
