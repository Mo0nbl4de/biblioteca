<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎧 Biblioteca de Áudios</title>

  <!-- Supabase SDK (UMD - SEM ERRO DE EXPORT) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }

    .audio-item {
      background: #222;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }

    audio {
      width: 100%;
      height: 28px;
      margin-top: 5px;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>🎧 Biblioteca de Áudios</h2>

<input id="nomeAudio" placeholder="Nome do áudio">
<input id="audioLink" placeholder="Link direto (.mp3)">
<button id="salvar" type="button">Salvar áudio</button>

<hr>

<input id="pesquisa" placeholder="🔍 Pesquisar pelo nome...">

<div id="listaAudios"></div>

<script>
/* =======================
   CONFIGURAÇÃO SUPABASE
   ======================= */

const SUPABASE_URL = "https://ugfirrajqityvrgmndhz.supabase.co";
const SUPABASE_KEY = "sb_publishable_ivICA8vC-FaVguwsQVrqeQ_SqoOlpHR";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =======================
   ELEMENTOS
   ======================= */

const nomeInput = document.getElementById("nomeAudio");
const linkInput = document.getElementById("audioLink");
const salvarBtn = document.getElementById("salvar");
const lista = document.getElementById("listaAudios");
const pesquisaInput = document.getElementById("pesquisa");

let audios = [];

/* =======================
   CARREGAR ÁUDIOS
   ======================= */
async function carregarAudios() {
  const { data, error } = await supabaseClient
    .from("audios")
    .select("*")
    .order("id", { ascending: true });

  if (error) {
    console.error("Erro ao carregar:", error);
    alert("Erro ao carregar áudios");
    return;
  }

  audios = data || [];
  renderizar();
}

/* =======================
   SALVAR ÁUDIO
   ======================= */
async function salvarAudio() {
  const nome = nomeInput.value.trim();
  const link = linkInput.value.trim();

  if (!nome || !link) {
    alert("Preencha nome e link");
    return;
  }

  const { error } = await supabaseClient
    .from("audios")
    .insert([{ nome, link }]);

  if (error) {
    console.error("Erro ao salvar:", error);
    alert("Erro ao salvar áudio");
    return;
  }

  nomeInput.value = "";
  linkInput.value = "";

  carregarAudios();
}

/* =======================
   RENDERIZAR
   ======================= */
function renderizar() {
  const filtro = pesquisaInput.value.toLowerCase();
  lista.innerHTML = "";

  audios
    .filter(a => a.nome.toLowerCase().includes(filtro))
    .forEach(a => {
      const div = document.createElement("div");
      div.className = "audio-item";

      div.innerHTML = `
        <strong>${a.nome}</strong>
        <audio controls src="${a.link}"></audio>
      `;

      lista.appendChild(div);
    });
}

/* =======================
   EVENTOS
   ======================= */
salvarBtn.addEventListener("click", salvarAudio);
pesquisaInput.addEventListener("input", renderizar);

/* =======================
   INICIAR
   ======================= */
carregarAudios();
</script>

</body>
</html>
